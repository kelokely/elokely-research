<svg xmlns="http://www.w3.org/2000/svg" width="420" height="670" viewBox="0 0 420 670" role="img" aria-labelledby="title desc">
<title id="title">Conformational search with explicit uncertainty</title><desc id="desc">CertCrest concept workflow connects a declared search scope, repeated searches, clustering and energy re-ranking, statistical evidence, and a bounded result or further sampling.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8d6b35"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="420" height="670" fill="#fff"/>
<rect x="20" y="24" width="380" height="104" rx="10" fill="#f6f7f2" stroke="#d8ddd3" stroke-width="1.5"/><circle cx="55" cy="76" r="20" fill="#183b32"/><text x="55" y="84" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="92" y="59" font-size="23" fill="#183b32" font-weight="700" text-anchor="start">Define the search scope</text><text x="92" y="88" font-size="20" fill="#3f5149" font-weight="400" text-anchor="start">Method and energy window</text><text x="92" y="114" font-size="20" fill="#3f5149" font-weight="400" text-anchor="start">Solvent and stereochemistry</text><path d="M55 132 L55 141" fill="none" stroke="#8d6b35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="145" width="380" height="104" rx="10" fill="#f6f7f2" stroke="#d8ddd3" stroke-width="1.5"/><circle cx="55" cy="197" r="20" fill="#183b32"/><text x="55" y="205" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="92" y="180" font-size="23" fill="#183b32" font-weight="700" text-anchor="start">Repeat the searches</text><text x="92" y="209" font-size="20" fill="#3f5149" font-weight="400" text-anchor="start">Independent search replicas</text><text x="92" y="235" font-size="20" fill="#3f5149" font-weight="400" text-anchor="start">Matched search conditions</text><path d="M55 253 L55 262" fill="none" stroke="#8d6b35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="266" width="380" height="104" rx="10" fill="#f6f7f2" stroke="#d8ddd3" stroke-width="1.5"/><circle cx="55" cy="318" r="20" fill="#183b32"/><text x="55" y="326" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="92" y="301" font-size="23" fill="#183b32" font-weight="700" text-anchor="start">Compare conformers</text><text x="92" y="330" font-size="20" fill="#3f5149" font-weight="400" text-anchor="start">Cluster distinct families</text><text x="92" y="356" font-size="20" fill="#3f5149" font-weight="400" text-anchor="start">Re-rank relative energies</text><path d="M55 374 L55 383" fill="none" stroke="#8d6b35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="387" width="380" height="104" rx="10" fill="#f6f7f2" stroke="#d8ddd3" stroke-width="1.5"/><circle cx="55" cy="439" r="20" fill="#183b32"/><text x="55" y="447" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="92" y="422" font-size="23" fill="#183b32" font-weight="700" text-anchor="start">Assess sampling evidence</text><text x="92" y="451" font-size="20" fill="#3f5149" font-weight="400" text-anchor="start">Estimate search coverage</text><text x="92" y="477" font-size="20" fill="#3f5149" font-weight="400" text-anchor="start">Population uncertainty</text><path d="M55 495 L55 504" fill="none" stroke="#8d6b35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="508" width="380" height="104" rx="10" fill="#f6f7f2" stroke="#d8ddd3" stroke-width="1.5"/><circle cx="55" cy="560" r="20" fill="#183b32"/><text x="55" y="568" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="92" y="543" font-size="23" fill="#183b32" font-weight="700" text-anchor="start">Choose the next step</text><text x="92" y="572" font-size="20" fill="#3f5149" font-weight="400" text-anchor="start">Bounded ensemble result</text><text x="92" y="598" font-size="20" fill="#3f5149" font-weight="400" text-anchor="start">or additional sampling</text><text x="210" y="647" font-size="17" fill="#66756c" font-weight="400" text-anchor="middle">CertCrest · Sampling and uncertainty</text>
</svg>