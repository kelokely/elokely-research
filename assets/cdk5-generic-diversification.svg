<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720" role="img" aria-labelledby="title desc">
<title id="title">Diversifying CDK5 amine intermediates</title><desc id="desc">Two generic reaction routes show amine condensation with aromatic aldehydes to form imines and HATU-mediated amide coupling with carboxylic acids. No molecular structures are included.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8d6b35"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="420" height="720" fill="#fff"/>
<text x="20" y="31" font-size="27" fill="#183b32" font-weight="700" text-anchor="start">Imine formation</text><rect x="20" y="50" width="380" height="75" rx="10" fill="#f6f7f2" stroke="#d8ddd3" stroke-width="1.5"/><text x="210" y="82" font-size="25" fill="#183b32" font-weight="400" text-anchor="middle">Free-amine intermediate</text><text x="210" y="111" font-size="22" fill="#3f5149" font-weight="400" text-anchor="middle">+ aromatic aldehyde</text><path d="M45 134 L45 266" fill="none" stroke="#8d6b35" stroke-width="2.5" marker-end="url(#arrow)"/><text x="83" y="159" font-size="24" fill="#183b32" font-weight="700" text-anchor="start">Condensation</text><text x="83" y="187" font-size="22" fill="#3f5149" font-weight="400" text-anchor="start">4 Å molecular sieves</text><text x="83" y="215" font-size="21" fill="#3f5149" font-weight="400" text-anchor="start">DCM / MeOH or</text><text x="83" y="243" font-size="21" fill="#3f5149" font-weight="400" text-anchor="start">DCE / MeCN (series-dependent)</text><rect x="20" y="276" width="380" height="60" rx="10" fill="#f6f7f2" stroke="#d8ddd3" stroke-width="1.5"/><text x="210" y="314" font-size="26" fill="#183b32" font-weight="400" text-anchor="middle">Imine derivatives</text><text x="20" y="386" font-size="27" fill="#183b32" font-weight="700" text-anchor="start">Amide formation</text><rect x="20" y="405" width="380" height="75" rx="10" fill="#f6f7f2" stroke="#d8ddd3" stroke-width="1.5"/><text x="210" y="437" font-size="25" fill="#183b32" font-weight="400" text-anchor="middle">Free-amine intermediate</text><text x="210" y="466" font-size="22" fill="#3f5149" font-weight="400" text-anchor="middle">+ carboxylic acid</text><path d="M45 489 L45 595" fill="none" stroke="#8d6b35" stroke-width="2.5" marker-end="url(#arrow)"/><text x="83" y="516" font-size="24" fill="#183b32" font-weight="700" text-anchor="start">Amide coupling</text><text x="83" y="545" font-size="22" fill="#3f5149" font-weight="400" text-anchor="start">HATU · DIPEA · DMF</text><text x="83" y="574" font-size="21" fill="#3f5149" font-weight="400" text-anchor="start">0 °C to room temperature</text><rect x="20" y="605" width="380" height="60" rx="10" fill="#f6f7f2" stroke="#d8ddd3" stroke-width="1.5"/><text x="210" y="643" font-size="26" fill="#183b32" font-weight="400" text-anchor="middle">Amide derivatives</text><text x="210" y="702" font-size="16" fill="#66756c" font-weight="400" text-anchor="middle">Shared amine intermediate · Complementary routes</text>
</svg>