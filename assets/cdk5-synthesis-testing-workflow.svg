<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
  <title id="title">Our CDK5 synthesis and testing workflow</title>
  <desc id="desc">Five stages connect structure-guided design, synthesis of 46 compounds across four series, purification and NMR and HRMS characterization, ongoing CDK5/p25 testing, and future lead selection and optimization. No chemical structures are shown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#89998c"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .card{fill:#f6f7f2;stroke:#d8ddd3;stroke-width:1.5}
      .number{fill:#fff;font-size:22px;font-weight:700;text-anchor:middle}
      .heading{fill:#183b32;font-size:27px;font-weight:700}
      .body{fill:#3f5149;font-size:21px}
      .connector{fill:none;stroke:#89998c;stroke-width:2;marker-end:url(#arrow)}
      .status{font-size:13px;font-weight:700;letter-spacing:1px;text-anchor:middle}
    </style>
  </defs>
  <rect width="640" height="660" fill="#fff"/>
  <path class="connector" d="M57 132 V141"/>
  <path class="connector" d="M57 253 V262"/>
  <path class="connector" d="M57 374 V383"/>
  <path class="connector" d="M57 495 V504"/>

  <g transform="translate(0 24)">
    <rect class="card" x="20" width="600" height="104" rx="12"/>
    <circle cx="57" cy="52" r="23" fill="#183b32"/>
    <text class="number" x="57" y="60">1</text>
    <text class="heading" x="98" y="35">Structure-guided design</text>
    <text class="body" x="98" y="64">CDK5 contact networks</text>
    <text class="body" x="98" y="90">Kinase comparisons guide our designs</text>
  </g>

  <g transform="translate(0 145)">
    <rect class="card" x="20" width="600" height="104" rx="12"/>
    <circle cx="57" cy="52" r="23" fill="#183b32"/>
    <text class="number" x="57" y="60">2</text>
    <text class="heading" x="98" y="35">Analogue synthesis</text>
    <text class="body" x="98" y="64">46 small molecules across 4 series</text>
    <text class="body" x="98" y="90">Boc-protected · free base · imine · amide</text>
  </g>

  <g transform="translate(0 266)">
    <rect class="card" x="20" width="600" height="104" rx="12"/>
    <circle cx="57" cy="52" r="23" fill="#183b32"/>
    <text class="number" x="57" y="60">3</text>
    <text class="heading" x="98" y="35">Characterization</text>
    <text class="body" x="98" y="64">Purification and identity assessment</text>
    <text class="body" x="98" y="90">¹H/¹³C NMR and HRMS</text>
  </g>

  <g transform="translate(0 387)">
    <rect x="20" width="600" height="104" rx="12" fill="#fcf8ef" stroke="#b28a49" stroke-width="1.5"/>
    <circle cx="57" cy="52" r="23" fill="#8d6b35"/>
    <text class="number" x="57" y="60">4</text>
    <text class="heading" x="98" y="35">CDK5/p25 testing</text>
    <rect x="495" y="16" width="108" height="27" rx="13" fill="#eee2c9"/>
    <text class="status" x="549" y="35" fill="#755422">ONGOING</text>
    <text class="body" x="98" y="64">Assess inhibitory activity</text>
    <text class="body" x="98" y="90">Potency and selectivity under evaluation</text>
  </g>

  <g transform="translate(0 508)">
    <rect x="20" width="600" height="104" rx="12" fill="#fff" stroke="#a9b8aa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="57" cy="52" r="23" fill="#e9ede4"/>
    <text class="number" x="57" y="60" style="fill:#183b32">5</text>
    <text class="heading" x="98" y="35">Lead selection &amp; optimization</text>
    <rect x="536" y="16" width="67" height="27" rx="13" fill="#e9ede4"/>
    <text class="status" x="570" y="35" fill="#3f5149">NEXT</text>
    <text class="body" x="98" y="64">Use testing results to prioritize candidates</text>
    <text class="body" x="98" y="90">Refine the next design cycle</text>
  </g>
  <text x="320" y="645" text-anchor="middle" fill="#66756c" font-size="17">Our team · From design to experimentally evaluated candidates</text>
</svg>
